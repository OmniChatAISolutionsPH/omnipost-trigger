<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generate Content | OmniChat AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b1120, #1a2a4a);
      padding: 20px;
    }
    .card {
      max-width: 500px;
      width: 100%;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 48px 40px;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
    }
    h1 {
      font-size: 28px;
      color: #fff;
      margin-bottom: 8px;
    }
    .sub {
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      margin-bottom: 32px;
    }
    .btn {
      background: linear-gradient(135deg, #2b6c9e, #1a4a7a);
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 40px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(43, 108, 158, 0.4);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }
    .status.loading {
      display: block;
      color: #94b8e8;
      background: rgba(43, 108, 158, 0.1);
      border: 1px solid rgba(43, 108, 158, 0.2);
    }
    .status.success {
      display: block;
      color: #86efac;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    .status.error {
      display: block;
      color: #fca5a5;
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

<div class="card">
  <h1>📘 Generate Content</h1>
  <div class="sub">OmniChat AI — Content Generator</div>

  <button class="btn" id="generateBtn">🚀 Generate New Content</button>

  <div id="status" class="status"></div>

  <div class="footer">Content will be saved to Supabase for review</div>
</div>

<script>
  const btn = document.getElementById('generateBtn');
  const statusDiv = document.getElementById('status');

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    statusDiv.className = 'status loading';
    statusDiv.textContent = '⏳ Generating content... This may take 30-60 seconds.';

    try {
      const response = await fetch('https://api.github.com/repos/OmniChatAISolutionsPH/omnipost-content/actions/workflows/generate-content.yml/dispatches', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json',
          'Authorization': 'token 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'
        },
        body: JSON.stringify({
          ref: 'main'
        })
      });

      if (response.ok) {
        statusDiv.className = 'status success';
        statusDiv.textContent = '✅ Content generation started! Check Supabase in 1-2 minutes.';
      } else {
        const error = await response.json();
        statusDiv.className = 'status error';
        statusDiv.textContent = '❌ Error: ' + (error.message || 'Something went wrong');
      }
    } catch (error) {
      statusDiv.className = 'status error';
      statusDiv.textContent = '❌ Error: ' + error.message;
    }

    btn.disabled = false;
  });
</script>

</body>
</html>
